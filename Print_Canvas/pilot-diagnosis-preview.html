      bodyHtml: "<div class=\"aj-minutes-prose\"><p>اجتمعت لجنة التحصيل الدراسي برئاسة محمد بن فايز بن هلال الحربي بعد ثلاثة أسابيع من انطلاق الدراسة. عُرض مؤشر 2-1-1-2: «تدعم المدرسة تنفيذ المناهج؛ لتحقيق نواتج التعلم المستهدفة وفق الخطة الدراسية». ارتكز النقاش على الدرجة الكلية للتقويم الخارجي لعام 2025، وهي 71 بمستوى انطلاق، مرجعية عامة لتجويد الممارسات التدريسية داخل الصف.</p><p>نظرت اللجنة في الإجراء «دراسة نتائج تعلم الطلاب وتحليلها»، ثم في الإجراء «دعم جوانب القوة وتحديد جوانب الضعف». ورأت أن أول عمل ميداني هو رؤية التخطيط والتنفيذ داخل الحصة قبل الحكم على مسار بعينه.</p><p>القرارات:</p><p>1. يزور محمد بن فايز بن هلال الحربي أربع حصص استطلاعية في الأسبوعين الخامس والسادس لـ حسن نافع مساعد الهرساني وأحمد عبدالله عريج الحربي، أنس عبد الرحمن صالح الرحيلي، وإبراهيم سالم شذيان الحمدي، وفق معايير الزيارة المعتمدة.</p><p>2. تُرفع خلاصة الزيارات إلى اجتماع اللجنة يوم الأربعاء 14 أكتوبر 2026م.</p><p>3. يفعّل مجلس المعلمين الإجراء «تنفيذ جلسات مجتمعات مهنية بين معلمي التخصص» في اجتماعه يوم 7 أكتوبر 2026م.</p><table><thead><tr><th>الاسم</th><th>الصفة</th><th>التوقيع</th></tr></thead><tbody><tr><td>محمد بن فايز بن هلال الحربي</td><td>وكيل الشؤون التعليمية</td><td></td></tr><tr><td>منور بن محمد بن عليان اللهيبي</td><td>موجه طلابي</td><td></td></tr><tr><td>حسن نافع مساعد الهرساني</td><td>معلم</td><td></td></tr></tbody></table></div>",
