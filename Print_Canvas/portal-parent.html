<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بوابة ولي الأمر — الشراكة الأسرية</title>
  <link rel="stylesheet" href="css/fonts.css?v=font1">
  <link rel="stylesheet" href="css/portal-student.css?v=p22">

<body class="portal-student">
  <div class="portal-shell">
    <header class="portal-top">
      <div class="portal-brand">
        <h1>بوابة ولي الأمر الذكية</h1>
        <p>الشراكة الأسرية وخطوات الـ ٢٠ دقيقة اليومية — شاهد <span class="etec-code" dir="ltr">١-٣-١-٢</span></p>
      </div>
      <div class="portal-actions">
        <button type="button" class="portal-btn secondary" id="parent-logout">خروج</button>
      </div>
    </header>
    <p class="portal-status" id="parent-status"></p>
    <div id="parent-children" class="portal-grid family-grid"></div>
    <section class="portal-card parent-benef-sat" id="parent-benef-sat-card">
      <h2 style="color:#0b5e56;font-size:22px;border-bottom:2px solid #0b5e56;padding-bottom:6px;">قياس رضا المستفيد</h2>
      <p class="section-hint">خمس محاور من مرجع التقويم والشواهد — منفصل عن استبانة نافس. مسودة قابلة للتعديل ثم لقطة معتمدة للرصد.</p>
      <div id="parent-benef-sat-host" class="benef-sat-mount" aria-live="polite"></div>
    </section>
  </div>
  <script src="js/print-engine.js?v=pe1"></script>
  <script src="js/national-id-mask.js?v=m1"></script>
